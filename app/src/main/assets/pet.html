<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:transparent;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  width:150px;
  height:150px;
}
canvas{
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
</style>
</head><body>
<canvas id="c" width="14" height="14"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');

const G='#2d2d2d',B='#1a1a1a',W='#eee',E='#fff',P='#222',R='#e03030',RK='#ff6b6b',PK='#ffa0a0',Y='#fff5cc';

const frames={
  idle:[
   '   GGGGGG   ',
   '  GBBBBBBG  ',
   '  GBBBBBBG  ',
   ' GBBBBBBBBG ',
   ' GBBBBBBBBG ',
   ' GBWPBWPBWG ',
   ' GBBBBBBBBG ',
   ' GGBBBBBBG  ',
   '  GBRRRBG   ',
   '  GBRLRBG   ',
   '   GBRBG    ',
   '   GBRBG    ',
   '  GBBBBBG   ',
   ' GBBBBBBBG  ',
  ],
  happy:[
   '   GGGGGG   ',
   '  GBBBBBBG  ',
   '  GBBBBBBG  ',
   ' GBBBBBBBBG ',
   ' GBBBBBBBBG ',
   ' GBWPBWPBWG ',
   ' GBBBWBBBG  ',
   ' GGBKBBKG   ',
   '  GBKBBG    ',
   '  GKRLKG    ',
   '   GBBBG    ',
   '   GBBBG    ',
   '  GBBBBBG   ',
   ' GBBBBBBBG  ',
  ],
  sad:[
   '   GGGGGG   ',
   '  GBBBBBBG  ',
   '  GBBBBBBG  ',
   ' GPBBBBBBBG ',
   ' GBBBBBBBBG ',
   ' GBWPBWPBWG ',
   ' GBBBBBBBBG ',
   '  GGBBBBG   ',
   '   GBBBG    ',
   '  GPBBG     ',
   '  GBBBBG    ',
   '  GBRLBG    ',
   '  GBBBBBG   ',
   ' GBBBBBBBG  ',
  ],
  blink:[
   '   GGGGGG   ',
   '  GBBBBBBG  ',
   '  GBBBBBBG  ',
   ' GBBBBBBBBG ',
   ' GBBBBBBBBG ',
   ' GBPPPBPBBG ',
   ' GBBBBBBBBG ',
   ' GGBBBBBBG  ',
   '  GBRRRBG   ',
   '  GBRLRBG   ',
   '   GBRBG    ',
   '   GBRBG    ',
   '  GBBBBBG   ',
   ' GBBBBBBBG  ',
  ],
  love:[
   '   GGGGGG   ',
   '  GBBBBBBG  ',
   '  GBBBBBBG  ',
   ' GBBBBBBBBG ',
   ' GBKBBKBBGG ',
   ' GKPBPPKBBG ',
   ' GBBBBBBBBG ',
   ' GGBKPKBBG  ',
   '  GBPPKG    ',
   '  GKRLKG    ',
   '   GBBBG    ',
   '   GBBBG    ',
   '  GBBBBBG   ',
   ' GBBBBBBBG  ',
  ],
  angry:[
   '   GGGGGG   ',
   '  GBBBBBBG  ',
   '  GBBBBBBG  ',
   ' GBBBBBBBBG ',
   ' GPBBBBPPG  ',
   ' GBWPBWPBWG ',
   ' GBBBBBBBBG ',
   '  GGBBBBG   ',
   '   GBRG     ',
   '  GBRKG     ',
   '   GBRG     ',
   '  GBBBG     ',
   ' GBBBBBBG   ',
   ' GBBBBBBBG  ',
  ],
  sleep:[
   '   GGGGGG   ',
   '  GBBBBBBG  ',
   '  GBBBBBBG  ',
   ' GBBBBBBBBG ',
   ' GBBBBBBBBG ',
   ' GBBBBPBBGG ',
   ' GBBBBBBBG  ',
   '  GGBBBBG   ',
   '  GBBBBG    ',
   '  GBGLBG    ',
   '   GBBBG    ',
   '   GBBBG    ',
   '  GBBBBBG   ',
   ' GBBBBBBBG  ',
  ],
};

const COL={'G':G,'B':B,'W':W,'E':E,'P':P,'R':R,'K':RK,'L':PK,'Y':Y};

let currentMood='idle';
let breathing=true;
let breathFrame=0;

function draw(name){
  currentMood=name;
  const d=frames[name];
  if(!d)return;
  ctx.clearRect(0,0,14,14);
  for(let y=0;y<14;y++){
    for(let x=0;x<14;x++){
      const ch=d[y][x];
      if(ch!==' '&&COL[ch]){
        ctx.fillStyle=COL[ch];
        ctx.fillRect(x,y,1,1);
      }
    }
  }
}

let breathingUp=true;
function animate(){
  if(!breathing){requestAnimationFrame(animate);return;}
  if(breathingUp){
    breathFrame+=0.02;
    if(breathFrame>=1)breathingUp=false;
  }else{
    breathFrame-=0.02;
    if(breathFrame<=0)breathingUp=true;
  }
  c.style.transform='scale('+(1+breathFrame*0.03)+')';
  requestAnimationFrame(animate);
}

draw('idle');
c.style.width='130px';
c.style.height='130px';
animate();

setInterval(function(){
  if(currentMood==='idle'){
    draw('blink');
    setTimeout(function(){draw('idle');},150);
  }
},3000);

window.petEngine={
  onTap(){
    draw('happy');
    setTimeout(function(){draw('idle');},1000);
  },
  onDoubleTap(){
    draw('love');
    setTimeout(function(){draw('idle');},1800);
  },
  onLongPress(){
    draw('sad');
    setTimeout(function(){draw('idle');},1200);
  },
  setMood(m){
    if(frames[m]){
      draw(m);
      if(m==='sleep'){breathing=false;c.style.transform='scale(1)';}
      else{breathing=true;}
    }
  },
  getMood(){return currentMood;}
};
</script></body></html>
