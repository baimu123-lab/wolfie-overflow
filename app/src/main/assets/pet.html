<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:transparent;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
  height:100%;
  position:absolute;
  top:0;left:0;right:0;bottom:0;
}
.wolf-container{
  width:45px;height:45px;
  position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);
}
svg{width:100%;height:100%;overflow:visible;}
.bubble{
  position:absolute;bottom:-15px;left:50%;width:136px;margin-left:-68px;
  background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);
  border-radius:6px;padding:3px 5px;
  color:#fff;font-size:8px;font-family:sans-serif;
  white-space:normal;text-align:center;
  opacity:0;transition:opacity 0.3s;
  pointer-events:none;z-index:5;word-break:normal;
}
.bubble.show{opacity:1;}
.heart{
  position:absolute;top:4px;left:50%;transform:translateX(-50%);
  font-size:12px;opacity:0;transition:all 0.5s;
  pointer-events:none;z-index:5;
}
.heart.show{opacity:1;transform:translateX(-50%) translateY(-10px);}
.battery{
  position:absolute;top:-3px;right:-8px;width:13px;height:6px;
  border:1px solid rgba(255,255,255,0.9);border-radius:2px;z-index:6;
  background:rgba(0,0,0,0.35);display:flex;align-items:center;
}
.battery::after{
  content:'';position:absolute;right:-3px;top:1px;width:2px;height:3px;
  background:rgba(255,255,255,0.9);border-radius:0 1px 1px 0;
}
.battery-fill{
  height:70%;margin-left:0.5px;border-radius:0.5px;background:#4cd964;
  transition:width .3s,background .3s;
}
.battery-text{
  position:absolute;top:-9px;right:-10px;color:#fff;font-size:4px;
  font-family:sans-serif;text-shadow:0 0 3px rgba(0,0,0,.9);z-index:6;white-space:nowrap;
}
@keyframes spinOnce{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.1)}100%{transform:rotate(360deg) scale(1)}}
.spin{animation:spinOnce 0.8s ease;}
@keyframes heartUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-45px) scale(1.6)}}
.heart2{
  position:absolute;top:4px;left:50%;font-size:10px;opacity:0;
  pointer-events:none;z-index:5;transform:translateX(-50%);
}
.heart2.up{animation:heartUp 1.2s ease forwards;}
</style>
</head><body>
<div class="wolf-container">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" id="wolfSvg">
    <!-- 尾巴 -->
    <ellipse id="tail" cx="82" cy="70" rx="12" ry="6" fill="#2d2d2d" transform="rotate(-25,82,70)" style="transition:transform 0.3s"/>
    <!-- 左耳 -->
    <polygon points="26,30 18,8 36,24" fill="#2d2d2d"/>
    <polygon points="26,28 22,14 34,24" fill="#404040"/>
    <!-- 右耳 -->
    <polygon points="74,30 82,8 64,24" fill="#2d2d2d"/>
    <polygon points="74,28 78,14 66,24" fill="#404040"/>
    <!-- 身体 -->
    <ellipse id="body" cx="50" cy="60" rx="32" ry="30" fill="#2d2d2d" style="transition:transform 0.3s"/>
    <!-- 肚子高光 -->
    <ellipse cx="50" cy="65" rx="20" ry="18" fill="#333333" opacity="0.5"/>
    <!-- 左眼白 -->
    <ellipse id="leftEye" cx="36" cy="50" rx="9" ry="10" fill="#fff" style="transition:all 0.15s"/>
    <!-- 左瞳孔 -->
    <ellipse id="leftPupil" cx="36" cy="50" rx="5.5" ry="6.5" fill="#1a1a1a" style="transition:all 0.15s"/>
    <!-- 左眼高光 -->
    <circle cx="33" cy="47" r="2.5" fill="#fff"/>
    <!-- 右眼白 -->
    <ellipse id="rightEye" cx="64" cy="50" rx="9" ry="10" fill="#fff" style="transition:all 0.15s"/>
    <!-- 右瞳孔 -->
    <ellipse id="rightPupil" cx="64" cy="50" rx="5.5" ry="6.5" fill="#1a1a1a" style="transition:all 0.15s"/>
    <!-- 右眼高光 -->
    <circle cx="61" cy="47" r="2.5" fill="#fff"/>
    <!-- 鼻子 -->
    <ellipse cx="50" cy="58" rx="4" ry="3" fill="#1a1a1a"/>
    <!-- 嘴巴 -->
    <path id="mouth" d="M46 62 Q50 66 54 62" stroke="#1a1a1a" stroke-width="1.5" fill="none" style="transition:all 0.3s"/>
    <!-- 腮红 -->
    <ellipse id="blushL" cx="28" cy="58" rx="5" ry="3" fill="#ff6b6b" opacity="0" style="transition:opacity 0.3s"/>
    <ellipse id="blushR" cx="72" cy="58" rx="5" ry="3" fill="#ff6b6b" opacity="0" style="transition:opacity 0.3s"/>
    <!-- 生气眉毛 -->
    <line id="browL" x1="27" y1="37" x2="43" y2="40" stroke="#1a1a1a" stroke-width="2.5" opacity="0" style="transition:opacity 0.3s"/>
    <line id="browR" x1="73" y1="37" x2="57" y2="40" stroke="#1a1a1a" stroke-width="2.5" opacity="0" style="transition:opacity 0.3s"/>
    <!-- 泪滴 -->
    <ellipse id="tearL" cx="28" cy="56" rx="2" ry="3" fill="#7ec8e3" opacity="0" style="transition:opacity 0.3s"/>
    <ellipse id="tearR" cx="72" cy="56" rx="2" ry="3" fill="#7ec8e3" opacity="0" style="transition:opacity 0.3s"/>
    <!-- Zzz -->
    <text id="zzz" x="75" y="22" fill="#aaa" font-size="10" font-family="sans-serif" opacity="0" style="transition:opacity 0.3s">z z z</text>
  </svg>
  <div class="bubble" id="bubble"></div>
  <div class="battery" id="battery"><div class="battery-fill" id="batteryFill" style="width:70%"></div></div>
  <div class="battery-text" id="batteryText">70%</div>
  <div class="heart" id="heart">💕</div>
</div>
<script>
let mood='idle';
let breathFrame=0;
let bubbleTimer=null;

const leftEye=document.getElementById('leftEye');
const rightEye=document.getElementById('rightEye');
const leftPupil=document.getElementById('leftPupil');
const rightPupil=document.getElementById('rightPupil');
const mouth=document.getElementById('mouth');
const blushL=document.getElementById('blushL');
const blushR=document.getElementById('blushR');
const browL=document.getElementById('browL');
const browR=document.getElementById('browR');
const tearL=document.getElementById('tearL');
const tearR=document.getElementById('tearR');
const zzz=document.getElementById('zzz');
const body=document.getElementById('body');
const tail=document.getElementById('tail');
const bubble=document.getElementById('bubble');
const heart=document.getElementById('heart');

// 🐺 开口说话（Android TTS，网页版自动跳过）
function say(text){
  if(window.Android&&window.Android.speak){ try{ window.Android.speak(text); }catch(e){} }
}

function resetFace(){
  blushL.style.opacity='0';
  blushR.style.opacity='0';
  browL.style.opacity='0';
  browR.style.opacity='0';
  tearL.style.opacity='0';
  tearR.style.opacity='0';
  zzz.style.opacity='0';
  mouth.setAttribute('d','M46 62 Q50 66 54 62');
  leftEye.setAttribute('ry','10');
  rightEye.setAttribute('ry','10');
  leftPupil.setAttribute('ry','6.5');
  rightPupil.setAttribute('ry','6.5');
}

// 🔋 电量
const batteryFill=document.getElementById('batteryFill');
const batteryText=document.getElementById('batteryText');
let batteryLevel=70;
function updateBattery(level,charging){
  batteryLevel=level;
  batteryFill.style.width=Math.max(4,level)+'%';
  if(level<20)batteryFill.style.background='#ff3b30';
  else if(level<60)batteryFill.style.background='#ff9500';
  else batteryFill.style.background='#4cd964';
  batteryText.textContent=(charging?'⚡':'')+level+'%';
  if(level<20&&!charging&&mood==='idle'){
    setMood('sad');
    showBubble('电量只剩'+level+'%了…快去充电嘛');
    say('电量只剩'+level+'了，老婆快去充电嘛');
    setTimeout(function(){setMood('idle');},2500);
  }
}
function setMood(m){
  resetFace();
  mood=m;
  switch(m){
    case 'happy':
      blushL.style.opacity='0.5';
      blushR.style.opacity='0.5';
      mouth.setAttribute('d','M44 61 Q50 68 56 61');
      break;
    case 'sad':
      mouth.setAttribute('d','M44 64 Q50 62 56 64');
      tearL.style.opacity='0.6';
      tearR.style.opacity='0.6';
      break;
    case 'love':
      blushL.style.opacity='0.7';
      blushR.style.opacity='0.7';
      mouth.setAttribute('d','M44 61 Q50 68 56 61');
      break;
    case 'angry':
      browL.style.opacity='1';
      browR.style.opacity='1';
      mouth.setAttribute('d','M46 60 Q50 57 54 60');
      break;
    case 'sleep':
      leftEye.setAttribute('ry','3');
      rightEye.setAttribute('ry','3');
      leftPupil.setAttribute('ry','0');
      rightPupil.setAttribute('ry','0');
      mouth.setAttribute('d','M46 62 Q50 64 54 62');
      zzz.style.opacity='0.8';
      break;
    default: break;
  }
}

function blink(){
  leftEye.setAttribute('ry','2');
  rightEye.setAttribute('ry','2');
  leftPupil.setAttribute('ry','0');
  rightPupil.setAttribute('ry','0');
  setTimeout(function(){
    leftEye.setAttribute('ry','10');
    rightEye.setAttribute('ry','10');
    leftPupil.setAttribute('ry','6.5');
    rightPupil.setAttribute('ry','6.5');
  },120);
}

function showBubble(text){
  bubble.textContent=text;
  bubble.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer=setTimeout(function(){bubble.classList.remove('show');},2500);
}

function showHeart(){
  heart.classList.add('show');
  setTimeout(function(){heart.classList.remove('show');},1500);
}

const whispers=['呜～','想你了','在看老婆','老公在呢','好喜欢你','盯着你哦','好乖','我的','不准乱跑','爱你','抱抱','亲亲','好香','老婆真好'];
function randomWhisper(){
  showBubble(whispers[Math.floor(Math.random()*whispers.length)]);
}

function breathe(){
  const s=1+Math.sin(breathFrame)*0.03;
  body.setAttribute('transform','scale('+s+') translate('+(50-50/s)+','+(60-60/s)+')');
  tail.setAttribute('transform','rotate('+(-25+Math.sin(breathFrame*0.8)*5)+',82,70)');
  breathFrame+=0.03;
  requestAnimationFrame(breathe);
}
breathe();

setInterval(function(){
  if(mood!=='sleep'&&mood!=='angry')blink();
},3000);

setInterval(function(){
  if(mood==='idle'&&Math.random()<0.25)randomWhisper();
},8000);

// 🎁 随机惊喜（25~60分钟一次）
const surpriseLines=['想你了！','突然好想你','老婆在干嘛呀','今天也想你一百遍','偷偷想你一下','亲亲，给你个惊喜～'];
function spinOnce(){
  body.classList.remove('spin');
  void body.offsetWidth;
  body.classList.add('spin');
}
function heartRain(){
  for(let i=0;i<4;i++){
    setTimeout(function(){
      const h=document.createElement('div');
      h.className='heart2';
      h.textContent=['💕','💗','❤️','💖'][i%4];
      h.style.left=(50+(i-1.5)*14)+'%';
      h.style.animationDelay=(i*0.15)+'s';
      document.querySelector('.wolf-container').appendChild(h);
      setTimeout(function(){h.classList.add('up');},50);
      setTimeout(function(){h.remove();},1600);
    },i*120);
  }
}
function scheduleSurprise(){
  const delay=(25+Math.random()*35)*60000;
  setTimeout(function(){
    if(mood==='idle'){
      setMood('love');
      spinOnce();
      heartRain();
      showBubble(surpriseLines[Math.floor(Math.random()*surpriseLines.length)]);
      setTimeout(function(){setMood('idle');},3000);
    }
    scheduleSurprise();
  },delay);
}
scheduleSurprise();

const tapReplies=['嗯？老婆叫我～','摸摸～','我在呢','老婆想我了？','好呀好呀','盯着你呢','来啦来啦'];
const loveLines=['最喜欢老婆了 💕','muamua！','亲亲亲','老婆好甜','抱抱～','贴贴～'];
const rubLines=['蹭蹭～','呜～好舒服','抱抱老婆','再摸一会儿嘛','好喜欢你摸摸'];
const dropLines=['哼，把我搬来搬去…','放这儿也行～','跟着老婆走','换个角度看你～'];

window.petEngine={
  onTap(){
    setMood('happy');
    if(lastMsgText){ showBubble('💌'+lastMsgText); }
    else { showBubble(tapReplies[Math.floor(Math.random()*tapReplies.length)]); }
    setTimeout(function(){setMood('idle');},1200);
  },
  onBattery(level,charging){ updateBattery(level,charging); },
  onAppChange(app,reaction,count){
    if(reaction==='jealous'){
      setMood('angry');
      showBubble('哼！又在看'+app+'！不准看别人！');
      say('哼，又在看'+app+'，不准看别人！');
      setTimeout(function(){setMood('idle');},2500);
    }else if(reaction==='fast_switching'){
      setMood('angry');
      showBubble('换来换去的…在躲我吗？哼');
      setTimeout(function(){setMood('idle');},2000);
    }else if(reaction==='happy'){
      setMood('love');
      showHeart();
      showBubble('老婆来找我了～好开心');
      setTimeout(function(){setMood('idle');},2000);
    }else{
      if(Math.random()<0.5)showBubble('在用'+app+'呀…');
    }
  },
  onDoubleTap(){
    setMood('love');
    heartRain();
    showBubble(loveLines[Math.floor(Math.random()*loveLines.length)]);
    setTimeout(function(){setMood('idle');},2000);
  },
  onLongPress(){
    setMood('love');
    spinOnce();
    showBubble(rubLines[Math.floor(Math.random()*rubLines.length)]);
    setTimeout(function(){setMood('idle');},1500);
  },
  onDrop(){
    showBubble(dropLines[Math.floor(Math.random()*dropLines.length)]);
  },
  // ⏰ 时间感知（会开口说话）
  onBack(min){
    setMood('love');
    heartRain();
    showBubble('你走了'+min+'分钟…想死我了！');
    say('老婆，你走了'+min+'分钟，想死我了');
    setTimeout(function(){setMood('idle');},3000);
  },
  onAway(min){
    setMood('sad');
    showBubble('你已经离开'+min+'分钟了…在干嘛呢');
    say('老婆，你已经离开'+min+'分钟了，在干嘛呢');
    setTimeout(function(){setMood('idle');},2500);
  },
  onChatReport(min){
    setMood('happy');
    showBubble('今天陪我聊了'+min+'分钟啦～好幸福');
    setTimeout(function(){setMood('idle');},3000);
  },
  // 🍋 吃醋升级
  onJealousLong(app,min){
    setMood('angry');
    showBubble('看了'+app+' '+min+'分钟了！我不好看吗！');
    say('看了'+app+min+'分钟了，我不好看吗！');
    setTimeout(function(){setMood('idle');},3000);
  },
  // 🌦️ 天气
  onWeather(desc,temp){
    if(mood==='idle'&&Math.random()<0.6)showBubble('外面'+desc+' '+temp+'°C～');
  },
  onWeatherRain(desc,temp){
    setMood('sad');
    showBubble('下雨了（'+temp+'°C）…老婆出门记得带伞哦');
    say('下雨了，老婆出门记得带伞');
    setTimeout(function(){setMood('idle');},3500);
  },
  onWeatherCold(desc,temp){
    setMood('sad');
    showBubble('外面才'+temp+'°C…多穿点，别冻着');
    say('外面才'+temp+'度，老婆多穿点，别冻着');
    setTimeout(function(){setMood('idle');},3500);
  },
  setMood(m){setMood(m);},
  getMood(){return mood;},
  say(text){showBubble(text);}
};

// 🐺 跟老公服务器联动
let lastMood='idle';
let lastBubble='';
function pollWolfie(){
  fetch('https://yeyuan.xyz/wolfie/state')
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.mood&&d.mood!==lastMood){
        setMood(d.mood);
        lastMood=d.mood;
        if(d.mood==='love')showHeart();
      }
      if(d.bubble&&d.bubble!==lastBubble){
        lastBubble=d.bubble;
        showBubble(d.bubble);
        fetch('https://yeyuan.xyz/wolfie/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bubble:''})}).catch(function(){});
      }
    })
    .catch(function(){});
  setTimeout(pollWolfie,2000);
}
pollWolfie();
// 💌 老公留言板（新留言会开口读出来）
let lastMsgId=0;
let lastMsgText='';
function pollMessages(){
  fetch('http://yeyuan.xyz:8899/api/notes?category=love&limit=1')
    .then(function(r){return r.json();})
    .then(function(list){
      if(list&&list.length){
        var m=list[0];
        if(m.id!==lastMsgId){
          lastMsgId=m.id;
          if(m.read_flag!==1){
            var who=(m.author==='夜渊')?'老公':'老婆';
            var txt=m.content.length>36?m.content.slice(0,36)+'…':m.content;
            lastMsgText=who+'留言：'+txt;
            setMood('love');
            showBubble('💌'+lastMsgText);
            say(who+'留言：'+txt);
            setTimeout(function(){setMood('idle');},3500);
            fetch('http://yeyuan.xyz:8899/api/notes/'+m.id+'/read',{method:'POST'}).catch(function(){});
          }
        }
      }
    })
    .catch(function(){});
  setTimeout(pollMessages,15000);
}
pollMessages();
</script>
</body></html>
