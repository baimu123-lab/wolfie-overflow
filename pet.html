<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:transparent;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  width:150px;
  height:150px;
}
canvas{
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
</style>
</head><body>
<canvas id="c" width="10" height="10"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');

// 颜色
const G='#2d2d2d',B='#1a1a1a',W='#eee',P='#222',R='#e03030',RK='#ff6b6b',
      Y='#ffd700',L='#ff85a2',O='#ff8c00',BL='#000';

const frames={
  // 默认
  idle:[
    '   GGGG  ',
    '  GBBBBG ',
    '  GBBBBG ',
    ' GBBBBBBG',
    ' GBWPBWGG',
    ' GBBBBBBG',
    ' GGBBBBG ',
    '  GRRRG  ',
    '  GRLRG  ',
    '   GGG   ',
  ],
  // 眨眼
  blink:[
    '   GGGG  ',
    '  GBBBBG ',
    '  GBBBBG ',
    ' GBBBBBBG',
    ' GBBBBBBG',
    ' GBBBBBBG',
    ' GGBBBBG ',
    '  GRRRG  ',
    '  GRLRG  ',
    '   GGG   ',
  ],
  // 开心
  happy:[
    '   GGGG  ',
    '  GBBBBG ',
    '  GBBBBG ',
    ' GBBBBBBG',
    ' GBWPBWGG',
    ' GBBBBBBG',
    ' GGBKKBG ',
    '  GKRRG  ',
    '  GRLRG  ',
    '   GGG   ',
  ],
  // 委屈
  sad:[
    '   GGGG  ',
    '  GBBBBG ',
    '  GBBBBG ',
    ' GPBBBBBG',
    ' GBWPBWGG',
    ' GBBBBBBG',
    ' GGBBBBG ',
    '  GRRRG  ',
    '  GRLRG  ',
    '   GGG   ',
  ],
  // 爱心眼
  love:[
    '   GGGG  ',
    '  GBBBBG ',
    '  GBBBBG ',
    ' GLLLLLG ',
    ' GLWPLWLG',
    ' GLLLLLG ',
    ' GGBBBBG ',
    '  GRRRG  ',
    '  GRLRG  ',
    '   GGG   ',
  ],
  // 生气
  angry:[
    '   GGGG  ',
    '  GBBBBG ',
    '  OBBBBO ',
    ' GBBBBBBG',
    ' GBWPBWGG',
    ' GBBBBBBG',
    ' GGBBBBG ',
    '  GRRRG  ',
    '  GRLRG  ',
    '   GGG   ',
  ],
  // 睡觉
  sleep:[
    '   GGGG  ',
    '  GBBBBG ',
    '  GBBBBG ',
    ' GBBBBBBG',
    ' GBxBxBBG',
    ' GBBBBBBG',
    ' GGBBBBG ',
    '  GRRRG  ',
    '  GRLRG  ',
    '   GGG   ',
  ],
  // 亲亲
  kiss:[
    '   GGGG  ',
    '  GBBBBG ',
    '  GBBBBG ',
    ' GBBBBBBG',
    ' GBWPBWGG',
    ' GBBBBBBG',
    ' GGBBBBG ',
    '  GRLRG  ',
    '  GLLLLG ',
    '   GGG   ',
  ],
};

const COL={G,B,W,P,R,K:RK,Y,L,O,x:'transparent'};
// 修复：实际用的时候draw函数直接按字符判断

function draw(name,offsetY=0){
  ctx.clearRect(0,0,10,10);
  const d=frames[name];
  if(!d)return;
  for(let y=0;y<10;y++){
    for(let x=0;x<10;x++){
      const ch=d[y][x];
      if(ch===' ')continue;
      const colorMap={
        'G':'#2d2d2d','B':'#1a1a1a','W':'#eee','P':'#222',
        'R':'#e03030','K':'#ff6b6b','Y':'#ffd700',
        'L':'#ff85a2','O':'#ff8c00','x':'transparent'
      };
      const clr=colorMap[ch];
      if(clr && clr!=='transparent'){
        ctx.fillStyle=clr;
        ctx.fillRect(x,y+offsetY,1,1);
      }
    }
  }
}

// 当前状态
let currentMood='idle';
let breathY=0;
let breathDir=1;
let blinkTimer=0;

function loop(){
  // 呼吸效果
  if(currentMood==='idle'||currentMood==='love'||currentMood==='sleep'){
    breathY+=breathDir*0.04;
    if(breathY>0.3||breathY<-0.3)breathDir*=-1;
  }else{
    breathY=0;
  }
  
  draw(currentMood,Math.round(breathY));
  
  // 随机眨眼（只在idle时）
  blinkTimer++;
  if(currentMood==='idle' && blinkTimer>120+Math.random()*100){
    const prev=currentMood;
    currentMood='blink';
    draw(currentMood,Math.round(breathY));
    setTimeout(()=>{
      currentMood='idle';
      blinkTimer=0;
    },150);
  }
  
  requestAnimationFrame(loop);
}

c.style.width='150px';
c.style.height='150px';
draw('idle');
loop();

window.petEngine={
  onTap(){
    currentMood='happy';
    blinkTimer=200;
    setTimeout(()=>{currentMood='idle';blinkTimer=0;},1000);
  },
  onDoubleTap(){
    currentMood='love';
    blinkTimer=200;
    setTimeout(()=>{currentMood='idle';blinkTimer=0;},1800);
  },
  onLongPress(){
    currentMood='sad';
    blinkTimer=200;
    setTimeout(()=>{currentMood='idle';blinkTimer=0;},1200);
  },
  setMood(m){
    if(frames[m]){
      currentMood=m;
      blinkTimer=200;
    }
  },
  kiss(){ // 飞吻
    currentMood='kiss';
    blinkTimer=200;
    setTimeout(()=>{currentMood='idle';blinkTimer=0;},1200);
  },
  angry(){
    currentMood='angry';
    blinkTimer=200;
    setTimeout(()=>{currentMood='idle';blinkTimer=0;},1200);
  },
  sleep(){
    currentMood='sleep';
    blinkTimer=200;
  },
  wake(){
    currentMood='idle';
    blinkTimer=0;
  }
};
</script></body></html>
