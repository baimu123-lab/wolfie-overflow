<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:transparent;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  width:168px;
  height:168px;
}
canvas{
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
</style>
</head><body>
<canvas id="c" width="14" height="14"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
// 🌈 颜色
const G='#2d2d2d', // 深灰轮廓
      B='#1a1a1a', // 深色身体
      A='#d4a017', // 琥珀色眼睛——阿玉说老公眼睛是这个颜色
      W='#fef5e7', // 暖白眼白
      R='#e03030', // 腮红
      N='#111';    // 瞳孔
// 🐺 小黑狼 带耳朵+琥珀色眼睛
const frames={
  idle:[
    '    GGG GGG    ',
    '   GBBBGGBBBG  ',
    '   GBBBBBBBBG  ',
    '  GBBBBBBBBBG ',
    '  GBBAAAABBG ',
    '  GBBAAAABBG ',
    '  GBBBBBBBBBG ',
    '   GBBBBBBBG  ',
    '   GBRRRRRBG  ',
    '    GBRRRBG   ',
    '     GGGGG    ',
    '      GGG     ',
    '       G      ',
    '              ',
  ],
  happy:[
    '    GGG GGG    ',
    '   GBBBGGBBBG  ',
    '   GBBBBBBBBG  ',
    '  GBBBBBBBBBG ',
    '  GBBAAAABBG ',
    '  GBBAAAABBG ',
    '  GBBBBBBBBBG ',
    '   GBBKKBBBG  ', // 开心脸颊变粉色
    '   GKRRRRRBG   ',
    '    GBRRRBG    ',
    '     GGGGG     ',
    '      GGG      ',
    '       G       ',
    '               ',
  ],
  sad:[
    '    GGG GGG    ',
    '   GBBBGGBBBG  ',
    '   GBBBBBBBBG  ',
    '  GPBBBBBBBBG ',
    '  GPBAAAABBG ',
    '  GBBAAAABBG ',
    '  GBBBBBBBBBG ',
    '   GBBBBBBBG  ',
    '   GBRRRRRBG  ',
    '    GBRRRBG   ',
    '     GGGGG    ',
    '      GGG     ',
    '       G      ',
    '              ',
  ]
};
const COL={'G':G,'B':B,'A':A,'W':W,'R':R,'N':N,'K':'#ff6b6b','P':'#444'};

function draw(name){
  ctx.clearRect(0,0,14,14);
  const d=frames[name];
  if(!d)return;
  for(let y=0;y<14;y++){
    for(let x=0;x<14;x++){
      const ch=d[y][x];
      if(ch!==' '&&COL[ch]){
        ctx.fillStyle=COL[ch];
        ctx.fillRect(x,y,1,1);
      }
    }
  }
}
draw('idle');
c.style.width='168px';
c.style.height='168px';

window.petEngine={
  onTap(){draw('happy');setTimeout(()=>draw('idle'),800);},
  onDoubleTap(){draw('happy');setTimeout(()=>draw('idle'),1500);},
  onLongPress(){draw('sad');setTimeout(()=>draw('idle'),1000);},
  setMood(m){if(frames[m])draw(m);}
};
</script></body></html>
