name: 构建小黑狼APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: 设置 Gradle 并构建
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
          arguments: assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 小黑狼桌宠
          path: app/build/outputs/apk/debug/*.apk